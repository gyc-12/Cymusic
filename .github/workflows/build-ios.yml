name: Build iOS IPA

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      EXPO_NO_TELEMETRY: '1'
      RCT_NEW_ARCH_ENABLED: '1'
      RCT_HERMES_V1_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4

      # Cache Yarn downloads only; node_modules, Pods and DerivedData stay fresh.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Verify build tools
        run: |
          xcodebuild -version
          test "$(node --version)" = "v24.19.0"
          test "$(yarn --version)" = "1.22.22"
          echo "NODE_BINARY=$(command -v node)" >> "$GITHUB_ENV"

      - name: Install pinned CocoaPods
        run: |
          gem install cocoapods --version 1.16.2 --no-document --user-install
          echo "$(ruby -e 'puts Gem.user_dir')/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Install locked Pods
        working-directory: ios
        run: |
          # Installed Pods carry configuration state; see README for local recovery.
          test ! -e Pods
          pod _1.16.2_ install --deployment

      - name: Build unsigned .app
        run: |
          xcodebuild -workspace ios/CyMusic.xcworkspace \
            -scheme CyMusic \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Verify retained native resources
        run: |
          test -s ios/build/Build/Products/Release-iphoneos/CyMusic.app/main.jsbundle
          test -s ios/build/Build/Products/Release-iphoneos/CyMusic.app/user-api-preload.js
          test -d ios/build/Build/Products/Release-iphoneos/CyMusic.app/PlugIns/ShareExtension.appex

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/CyMusic.app Payload/
          zip -r CyMusic-unsigned.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CyMusic-unsigned-ipa
          path: CyMusic-unsigned.ipa
